<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpongeSquad journey</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #203c3b; background: #f5f4ef; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(880px, calc(100% - 40px)); }
      small { letter-spacing: .14em; font-weight: 700; color: #657569; }
      h1 { font-size: clamp(38px, 7vw, 72px); letter-spacing: -.05em; margin: 18px 0 12px; }
      p { color: #68776f; line-height: 1.6; max-width: 620px; }
      .steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 42px; }
      a { color: inherit; text-decoration: none; padding: 26px; border: 1px solid #cbd2c9; border-radius: 9px; background: #fbfaf6; }
      a:hover { border-color: #6d8e76; background: #eef2e8; }
      a span { display: block; color: #6a7b71; font-size: 12px; margin-bottom: 15px; }
      a strong { font-size: 24px; }
      @media (max-width: 620px) { .steps { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <small>SPONGE SQUAD · END-TO-END PROTOTYPE</small>
      <h1>Find a place. Test a connected street.</h1>
      <p>The site-scoping map carries evidence and unknowns into a deliberately illustrative street scenario. Candidate scores never become hydraulic parameters.</p>
      <div class="steps">
        <a href="/data/site-scoping-tool/"><span>01 · FIND</span><strong>Open site scoping →</strong></a>
        <a href="/wrapper/street-workspace/"><span>02 · TEST</span><strong>Open Street Lab →</strong></a>
      </div>
    </main>
  </body>
</html>
